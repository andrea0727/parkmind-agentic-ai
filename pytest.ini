# Needed because src/ isn't pip-installed as a package (no pyproject.toml —
# kept simple on purpose). This one setting is what lets pytest find
# `parkmind.*` imports; nothing else in this file matters.
[pytest]
pythonpath = src
testpaths = tests
markers =
    db: needs a real PostgreSQL (docker compose up -d); skipped when unreachable, fails when CI is set
