# Needed because src/ isn't pip-installed as a package (no pyproject.toml —
# kept simple on purpose). This one setting is what lets pytest find
# `parkmind.*` imports; `.` lets tests import the root-level `server.py`.
#
# Test taxonomy: docs/testing/README.md. Every test gets a layer marker from the
# folder it lives in (tests/conftest.py), so `pytest -m workflow` or
# `pytest -m "not live"` work without decorating each test.
[pytest]
pythonpath = src .
testpaths = tests
addopts = --strict-markers
markers =
    unit: one unit in isolation (tests/unit); applied by folder
    integration: several units wired together on in-memory ports (tests/integration); applied by folder
    architecture: import boundaries and ownership rules (tests/architecture); applied by folder
    e2e: layer 1, whole user journeys from the scenario catalog (tests/e2e); applied by folder
    workflow: layer 2, agent and graph behavior: routing, state, interrupts, retries (tests/workflow); applied by folder
    llm_eval: layer 3, quality of LLM output: accuracy, groundedness, instruction following (tests/evals); applied by folder
    observability: layer 4, traces, spans, tool calls and errors reach Langfuse masked (tests/observability); applied by folder
    reliability: layer 5, failure injection, retries, recovery and execution limits (tests/resilience); applied by folder
    security: layer 5, prompt injection, authorization and data leakage (tests/security); applied by folder
    performance: layer 5, latency, concurrency and cost budgets (tests/performance); applied by folder
    live: calls real external services (Anthropic, ThemeParks, Open-Meteo, Postgres); skipped unless --live or PARKMIND_RUN_LIVE=1
    db: needs a real PostgreSQL (docker compose up -d); skipped when unreachable, fails when CI is set
    requires_model: needs the local embedding model (scripts/fetch_embedding_model.py); skipped when it is not cached, never downloaded by PR CI
