# Alembic configuration for ParkMind (P0-12).
#
# Run from the repo root:
#   poetry run alembic -c database/alembic.ini upgrade head
#
# The database URL is deliberately NOT set here: migrations/env.py resolves it
# (programmatic override, `-x url=...`, then DATABASE_URL from the environment).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
