name: CI

# P0-04: every pull request runs automated checks (formatting/linting, type
# checking, unit + basic integration tests, import-boundary check). A failing
# check fails the job -- no step below uses continue-on-error.
#
# P0-12: the repository tests (marked `db`) run against a real Postgres, the
# `services: postgres:` container below. CI is set by GitHub Actions, so an
# unreachable database FAILS those tests instead of skipping them.
#
# P0-26: that Postgres gets pgvector installed by the first step; the
# embedding model is never downloaded here (tests use a deterministic embedder).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    # Pinned: GitHub moves `ubuntu-latest` to Ubuntu 26 from 2026-10-19; change
    # the image on purpose, not by surprise.
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Official Docker Hub image via its AWS ECR Public mirror: anonymous
        # Docker Hub pulls from shared runners hit the rate limit / auth
        # timeouts and fail the job before any check runs.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: parkmind
          POSTGRES_PASSWORD: parkmind
          POSTGRES_DB: parkmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pgvector into the Postgres service (P0-26)
        # There is no pgvector image outside Docker Hub, but the official image
        # carries the PGDG apt source: install the same package
        # database/Dockerfile installs for docker compose. No restart is needed
        # before `CREATE EXTENSION vector` (migration 0003).
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c \
            'apt-get -o Acquire::Retries=5 update \
             && apt-get -o Acquire::Retries=5 install -y --no-install-recommends "postgresql-$PG_MAJOR-pgvector"'
          docker exec ${{ job.services.postgres.id }} psql -U parkmind -d parkmind -tAc \
            "SELECT 'pgvector available: ' || default_version FROM pg_available_extensions WHERE name = 'vector'"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy src

      - name: Import-boundary check (import-linter)
        # PYTHONPATH=src mirrors pytest.ini's `pythonpath = src` -- the
        # package isn't pip-installed, so lint-imports needs the same hint
        # pytest gets automatically.
        run: poetry run lint-imports
        env:
          PYTHONPATH: src

      - name: Tests (pytest)
        run: poetry run pytest
        env:
          PARKMIND_TEST_DATABASE_URL: postgresql://parkmind:parkmind@localhost:5432/parkmind
