# scope: Postgres only. No pgvector/Qdrant container (knowledge
# store is in-memory
# src/parkmind/services/clients/knowledge_store.py).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parkmind
      POSTGRES_PASSWORD: parkmind
      POSTGRES_DB: parkmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No init.sql mount: the schema is owned by Alembic (database/migrations/).
      # Apply it with `poetry run alembic -c database/alembic.ini upgrade head`.

volumes:
  pgdata:
