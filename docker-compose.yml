# scope: one Postgres 16 with pgvector (P0-26). Transactional data and the
# knowledge store's embeddings share the instance (Architecture section 41);
# the image is built from database/Dockerfile.
#
# After pulling this change, rebuild once: `docker compose up -d --build`
# (the pgdata volume and its data are kept).

services:
  # `docker compose up --build` -> http://localhost:8000 (UI) and /docs (OpenAPI).
  # Needs ANTHROPIC_API_KEY in .env, plus PARKMIND_AUTH_USERS and
  # PARKMIND_JWT_SECRET (see .env.example): the API refuses to start without credentials.
  # Single worker by design (in-memory sessions).
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://parkmind:parkmind@postgres:5432/parkmind
      PARKMIND_KNOWLEDGE_BACKEND: in_memory
      PARKMIND_WORKERS: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build: ./database
    environment:
      POSTGRES_USER: parkmind
      POSTGRES_PASSWORD: parkmind
      POSTGRES_DB: parkmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No init.sql mount: the schema is owned by Alembic (database/migrations/).
      # Apply it with `poetry run alembic -c database/alembic.ini upgrade head`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkmind -d parkmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
