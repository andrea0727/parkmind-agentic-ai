[tool.poetry]
name = "parkmind-agentic-ai"
version = "0.1.0"
description = "An agentic AI concierge that plans a guest's day at a theme park"
authors = ["Johanna Andrea <johanna@example.com>", "Sebastián Toro <sebastian@example.com>", "Santiago Isaza <santiago@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12.9"
# Runtime
pydantic = ">=2.6"
langgraph = ">=0.2"
langchain-anthropic = ">=0.2"
streamlit = ">=1.38"
httpx = ">=0.27"
psycopg = {extras = ["binary"], version = ">=3.2"}
python-dotenv = ">=1.0"
# Observability
langfuse = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
