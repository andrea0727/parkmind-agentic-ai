[tool.poetry]
name = "parkmind-agentic-ai"
version = "0.1.0"
description = "An agentic AI concierge that plans a guest's day at a theme park"
authors = ["Johanna Andrea <johanna@example.com>", "Sebastián Toro <sebastian@example.com>", "Santiago Isaza <santiago@example.com>"]
readme = "README.md"
# `parkmind` (src/) is never pip-installed -- pytest.ini / agent.py / scripts all
# add src/ to sys.path instead. Without this, `poetry install` on a fresh clone
# (no cached .venv, e.g. CI) tries to build/install a root package named after
# the project ("parkmind-agentic-ai" / "parkmind_agentic_ai") and fails with
# "No file/folder found for package parkmind-agentic-ai" since no such folder
# exists. This makes Poetry a pure dependency manager here, matching actual use.
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
# Runtime
pydantic = ">=2.6"
langgraph = ">=0.2"
langchain-anthropic = ">=0.2"
langchain-openai = {version = ">=0.3", optional = true}
langchain-google-genai = {version = ">=2.1", optional = true}
streamlit = ">=1.38"
httpx = ">=0.27"
psycopg = {extras = ["binary"], version = ">=3.2"}
python-dotenv = ">=1.0"
# Observability
langfuse = "^4.15"
langgraph-checkpoint-postgres = "^3.1.2"
alembic = "^1.20.0"
mcp = "~2.3"
fastembed = "~0.9"
fastapi = "^0.143.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
pyjwt = "^2.10"
langchain = "^1"

[tool.poetry.extras]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = "^2.3.1"
import-linter = "^2.15"

# Optional: LLM-as-judge evaluation (tests/evals). Install with `poetry install --with eval`;
# the eval tests skip themselves when it is absent. Its DeepEval bounds resolve older click, rich and
# huggingface-hub than the app alone (see poetry.lock), so CI and the Docker image leave the group out
# on purpose and the app's runtime versions are not the ones the evals ran with.
[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
deepeval = "^4.2.8"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["parkmind"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
